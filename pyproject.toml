[project]
name = "update-check"
version = "0.1.0"
description = "Weekly update checklist with reminders for Windows."
readme = "README.md"
authors = [
    { name = "Zora", email = "128193984+Zorakidd@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
]

[project.scripts]
update-check = "update_check:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
